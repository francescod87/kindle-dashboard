<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 758px;
    height: 1024px;
    background: #ffffff;
    color: #000000;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 20px;
    border: 4px solid #000;
    overflow: hidden;
  }
  /* Header: Data, Aggiornamento e Meteo */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 3px solid #000;
    padding-bottom: 12px;
    margin-bottom: 12px;
  }
  .date-box h1 { font-size: 34px; text-transform: uppercase; letter-spacing: 1px; }
  .date-box p { font-size: 16px; font-weight: bold; margin-top: 2px; color: #333; }
  .weather-box { text-align: right; }
  .weather-temp { font-size: 40px; font-weight: 900; }
  .weather-desc { font-size: 16px; font-weight: bold; }

  /* Griglia Informazioni Giornaliere (Santo & Aphorism) */
  .info-grid {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
  }
  .info-card {
    flex: 1;
    border: 2px solid #000;
    padding: 10px 12px;
  }
  .info-title {
    font-size: 14px;
    font-weight: 900;
    text-transform: uppercase;
    border-bottom: 1px solid #000;
    padding-bottom: 4px;
    margin-bottom: 6px;
  }
  .info-content {
    font-size: 15px;
    line-height: 1.3;
  }

  /* Foto del giorno */
  .photo-section {
    width: 100%;
    height: 300px;
    border: 3px solid #000;
    margin-bottom: 12px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f0f0f0;
  }
  .photo-section img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(100%) contrast(140%);
  }

  /* Blocco Agenda */
  .agenda-card {
    border: 2px solid #000;
    padding: 12px;
    display: flex;
    flex-direction: column;
    flex: 1;
    margin-bottom: 10px;
  }
  .card-title {
    font-size: 18px;
    font-weight: 900;
    text-transform: uppercase;
    border-bottom: 2px solid #000;
    padding-bottom: 4px;
    margin-bottom: 8px;
  }
  ul { list-style: none; }
  li {
    font-size: 17px;
    margin-bottom: 8px;
    line-height: 1.3;
  }
  .footer {
    font-size: 13px;
    text-align: right;
    color: #444;
  }
</style>
</head>
<body>
  <!-- Header: Data e Meteo Avanzato -->
  <div class="header">
    <div class="date-box">
      <h1>Dashboard</h1>
      <p>{{UPDATE_TIME}}</p>
    </div>
    <div class="weather-box">
      <div class="weather-temp">{{TEMP_CURRENT}}</div>
      <div class="weather-desc">{{TEMP_FORECAST}}</div>
    </div>
  </div>

  <!-- Sezione Santo del giorno & Aphorism -->
  <div class="info-grid">
    <div class="info-card">
      <div class="info-title">Santo del Giorno</div>
      <div class="info-content">{{SAINT}}</div>
    </div>
    <div class="info-card">
      <div class="info-title">Aphorism del Giorno</div>
      <div class="info-content" style="font-style: italic;">"{{APHORISM}}"</div>
    </div>
  </div>

  <!-- Foto del giorno -->
  <div class="photo-section">
    <img src="{{PHOTO_URL}}" alt="Foto del giorno">
  </div>

  <!-- Blocco Agenda -->
  <div class="agenda-card">
    <div class="card-title">Prossimi Eventi</div>
    <ul>
      {{EVENTS}}
    </ul>
  </div>

  <div class="footer">Aggiornato automaticamente da GitHub Actions</div>
</body>
</html>
