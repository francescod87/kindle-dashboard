<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 758px;
    height: 1024px;
    background: #ffffff;
    color: #000000;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 24px;
    border: 4px solid #000;
    overflow: hidden;
  }
  /* Header: Data e Meteo */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 3px solid #000;
    padding-bottom: 16px;
    margin-bottom: 16px;
  }
  .date-box h1 { font-size: 38px; text-transform: uppercase; letter-spacing: 1px; }
  .date-box p { font-size: 20px; font-weight: bold; margin-top: 4px; }
  .weather-box { text-align: right; }
  .weather-temp { font-size: 46px; font-weight: 900; }
  .weather-desc { font-size: 18px; }

  /* Blocco Agenda */
  .agenda-card {
    border: 2px solid #000;
    padding: 14px;
    display: flex;
    flex-direction: column;
    flex: 1;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 20px;
    font-weight: 900;
    text-transform: uppercase;
    border-bottom: 2px solid #000;
    padding-bottom: 6px;
    margin-bottom: 10px;
  }
  ul { list-style: none; }
  li {
    font-size: 18px;
    margin-bottom: 10px;
    line-height: 1.4;
  }
  .footer {
    font-size: 14px;
    text-align: right;
    color: #333;
  }
</style>
</head>
<body>
  <!-- Header con Data e Meteo -->
  <div class="header">
    <div class="date-box">
      <h1>Dashboard</h1>
      <p>{{UPDATE_TIME}}</p>
    </div>
    <div class="weather-box">
      <div class="weather-temp">{{TEMP}}</div>
    </div>
  </div>

  <!-- Blocco Agenda / Eventi -->
  <div class="agenda-card">
    <div class="card-title">Prossimi Eventi</div>
    <ul>
      {{EVENTS}}
    </ul>
  </div>

  <div class="footer">Aggiornato automaticamente da GitHub Actions</div>
</body>
</html>
