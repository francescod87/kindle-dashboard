<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 758px;
    height: 1024px;
    background: #ffffff;
    color: #000000;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 24px;
    border: 4px solid #000;
  }
  /* Header: Data e Meteo */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 3px solid #000;
    padding-bottom: 16px;
    margin-bottom: 16px;
  }
  .date-box h1 { font-size: 38px; text-transform: uppercase; letter-spacing: 1px; }
  .date-box p { font-size: 20px; font-weight: bold; margin-top: 4px; }
  .weather-box { text-align: right; }
  .weather-temp { font-size: 46px; font-weight: 900; }
  .weather-desc { font-size: 18px; }

  /* Foto del giorno */
  .photo-section {
    width: 100%;
    height: 360px;
    border: 3px solid #000;
    margin-bottom: 16px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f0f0f0;
  }
  .photo-section img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(100%) contrast(130%);
  }

  /* Blocco Agenda (A tutta larghezza) */

    border: 2px solid #000;
    padding: 14px;
    display: flex;
    flex-direction: column;
    flex: 1;
    margin-bottom: 16px;
  }

    font-size: 20px;
    font-weight: 900;
    text-transform: uppercase;
    border-bottom: 2px solid #000;
    padding-bottom: 6px;
    margin-bottom: 10px;
  }
